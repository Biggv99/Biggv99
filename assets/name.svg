<svg xmlns="http://www.w3.org/2000/svg" width="500" height="80">
  <defs>
    <!-- Qui definiamo il gradiente: va da sinistra (0%) a destra (100%) -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45a236" /> <!-- Verde ranocchia chiaro -->
      <stop offset="100%" stop-color="#12350d" /> <!-- Verde scuro -->
    </linearGradient>
  </defs>
  
  <!-- Qui stampiamo il testo applicando il gradiente -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="url(#grad)">
    Giorgio Venturella
  </text>
</svg>
